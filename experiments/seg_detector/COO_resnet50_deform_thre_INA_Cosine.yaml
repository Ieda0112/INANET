# CosineAnnealingLRを使用したバージョン
# エポック数に依存しない学習率スケジュール
import:
    - 'experiments/seg_detector/base_halfCOO.yaml'
package: []
define:
  - name: 'Experiment'
    class: Experiment
    structure: 
        class: Structure
        builder: 
            class: Builder
            model: SegDetectorModel
            model_args:
                backbone: deformable_resnet50
                decoder: SegDetector_Att_Next
                decoder_args: 
                    adaptive: True
                    in_channels: [256, 512, 1024, 2048]
                    k: 50
                loss_class: L1BalanceCELoss
        representer:
            class: SegDetectorRepresenter
            max_candidates: 1000
        measurer:  
            class: QuadMeasurer
        visualizer:  
            class: SegDetectorVisualizer
    train: 
        class: TrainSettings
        data_loader: 
            class: DataLoader
            dataset: ^train_data
            batch_size: 4
            num_workers: 0
        checkpoint: 
            class: Checkpoint
            start_epoch: 0
            start_iter: 0
            resume: null
        model_saver: 
            class: ModelSaver
            dir_path: model
            save_interval: 3000
            signal_path: save
        scheduler: 
            class: OptimizerScheduler
            optimizer: "SGD"
            optimizer_args:
                lr: 0.0005
                momentum: 0.9
                weight_decay: 0.0001
            learning_rate:  
                class: CosineAnnealingLR
                lr: 0.0005
                T_max: 50          # エポック数と一致させる
                eta_min: 0.00001   # 最小学習率
                warmup_epochs: 2   # 最初の2エポックでウォームアップ
        epochs: 50  # エポック数を変更しても学習率スケジュールは柔軟に対応

    validation:
        class: ValidationSettings
        data_loaders:
            COO:
                class: DataLoader
                dataset: ^validate_data_trainlike
                batch_size: 1
                num_workers: 0
        visualize: false
        interval: 4500
        exempt: 1

    evaluation:
        class: ValidationSettings
        data_loaders:
            COO: 
                class: DataLoader
                dataset: ^validate_data
                batch_size: 1
                num_workers: 0
                collect_fn:
                    class: ICDARCollectFN
        visualize: false
        interval: 4500
        exempt: 1

    logger:
        class: Logger
        verbose: true
        level: info
        log_interval: 1000
